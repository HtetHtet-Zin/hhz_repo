name: SVN → WAR → Tomcat (Windows CI/CD)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # auto check every 10 minutes

jobs:
  build-deploy:
    runs-on: self-hosted

    env:
      SVN_REPO_URL: http://your-svn-server/svn/project/trunk
      APP_NAME: club

    steps:
      - name: Checkout from SVN
        run: |
          if exist app rmdir /S /Q app
          svn checkout %SVN_REPO_URL% app

      - name: Build WAR
        run: |
          cd app
          mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        run: |
          net stop Tomcat10
          del /Q C:\Program Files\Apache Software Foundation\Tomcat 10.1\webapps\*.war
          rmdir /S /Q C:\Program Files\Apache Software Foundation\Tomcat 10.1\webapps\%APP_NAME%
          xcopy app\target\*.war C:\Program Files\Apache Software Foundation\Tomcat 10.1\webapps\%APP_NAME%.war /Y
          net start Tomcat10
